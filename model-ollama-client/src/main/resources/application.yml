# Ollama 客户端配置
ollama:
  local:
    base-url: http://localhost:11434
    connection-pool-size: 100
    connect-timeout: 5000
    read-timeout: 60000
    write-timeout: 30000
  remote:
    base-url: https://ollama.prod.example.com
    connection-pool-size: 200
    connect-timeout: 10000
    read-timeout: 120000
    write-timeout: 60000



# 缓存配置（Caffeine）
cache:
  caffeine:
    # 模型列表缓存过期时间（支持5m/10s等，@Value会自动转Duration）
    model-cache-expire: 5m
    # 缓存最大容量
    maximum-size: 100