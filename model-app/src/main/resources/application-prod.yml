# 生产环境配置（含敏感信息，不提交到Git）
spring:
  datasource:
    url: jdbc:mysql://生产数据库地址:3306/ai_chat_db?useSSL=true&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=false
    username: 生产数据库用户名
    password: 生产数据库密码  # 生产环境密码（敏感信息）
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 生产环境优化配置
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
logging:
  level:
    root: WARN
    com.lbq.ai_chat_project: INFO